<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Big RAS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one dark studio. Host = a 16:9 stage box scaled to the window (sizes in cqw); phone = a single column of big buttons. */
:root{
  --bg0:#070d16; --bg1:#0c1726; --bg2:#1f3d5c;
  --ink:#e9f1fb; --soft:#8fb3d9; --line:#3d6a99; --tile1:#183455; --tile2:#10233d; --chip:#25496f;
  --amber:#ffb547; --amber2:#e8952a; --amber-hi:#ffd38f; --amber-ink:#1a1204;
  --good:#2fbf71; --good2:#1d9655; --good-hi:#7ce3a8; --good-ink:#04170c;
  --bad:#e5484d; --bad2:#b02f36; --bad-hi:#ff9a9e;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 90% at 50% -10%,var(--bg2) 0%,var(--bg1) 55%,var(--bg0) 100%) fixed var(--bg0);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--chip) center 30%/cover no-repeat;color:var(--ink);font-weight:800;border:2px solid var(--line);position:relative;flex:none;overflow:visible}
.av.on{border-color:var(--amber)}

/* ================= HOST ================= */
.host{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.box{width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size;position:relative}
.scr{position:absolute;inset:0;padding:2.8cqw 3.4cqw 6.8cqw;display:flex;flex-direction:column;gap:2cqw}
.top{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.grp{display:flex;align-items:center;gap:1.2cqw;font:700 1.9cqw/1.1 var(--body);min-width:0}
.gnum{flex:none;width:3.4cqw;height:3.4cqw;border-radius:.8cqw;display:grid;place-items:center;font:800 1.9cqw/1 var(--display);background:oklch(.78 .14 var(--h,70));color:var(--amber-ink)}
.qn{font:600 1.7cqw/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.timer{position:relative;width:6.4cqw;height:6.4cqw;flex:none;display:grid;place-items:center;font:800 2.6cqw/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.timer circle{fill:none;stroke-width:.45cqw}
.timer .trk{stroke:rgb(255 181 71 / .18)}
.timer .arc{stroke:var(--amber);stroke-linecap:round;filter:drop-shadow(0 0 .6cqw rgb(255 181 71 / .45))}
.timer.low{color:var(--bad-hi)}
.timer.low .arc{stroke:var(--bad)}
.timer.paused{color:var(--soft)}
.q{font:800 3.6cqw/1.15 var(--display);text-wrap:balance;margin:0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;margin-top:auto}
.a{display:flex;align-items:center;gap:1.4cqw;padding:1.5cqw 1.8cqw;font:600 2.2cqw/1.15 var(--body);position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--tile1),var(--tile2));border:.18cqw solid var(--line);border-radius:5cqw;transition:background .3s,border-color .3s,opacity .3s,transform .3s;text-align:left}
.a b{flex:none;width:3cqw;font:800 2cqw/1 var(--display);color:var(--amber);position:relative}
.a .t{position:relative;min-width:0}
.a .n{margin-left:auto;font:800 1.9cqw/1 var(--display);position:relative;font-variant-numeric:tabular-nums}
.a .bar{position:absolute;inset:0 auto 0 0;background:rgb(255 181 71 / .2);transition:width .8s cubic-bezier(.2,.8,.3,1)}
.a.sel,.a.pending{background:linear-gradient(180deg,var(--amber),var(--amber2));color:var(--amber-ink);border-color:var(--amber-hi)}
.a.sel b,.a.pending b{color:var(--amber-ink)}
.a.sel{animation:pulse 1s ease-in-out infinite alternate}
.a.right{background:linear-gradient(180deg,var(--good),var(--good2));border-color:var(--good-hi);color:var(--good-ink);animation:none}
.a.right b{color:var(--good-ink)}
.a.right .bar{background:rgb(255 255 255 / .18)}
.a.wrong{background:linear-gradient(180deg,var(--bad),var(--bad2));border-color:var(--bad-hi);color:#fff;animation:none}
.a.wrong b{color:#fff}
.a.dim{opacity:.55}
button.a{cursor:pointer}
@keyframes pulse{to{box-shadow:0 0 2.4cqw rgb(255 181 71 / .55)}}
.players{display:flex;align-items:center;gap:.8cqw;font-size:1.5cqw;min-height:4cqw}
.players .av{width:3.6cqw;height:3.6cqw;font-size:1.25cqw;border-width:.2cqw}
.players .av.off{opacity:.35}
.players .av.ok::after,.players .av.yes::after,.players .av.no::after{position:absolute;right:-.5cqw;bottom:-.5cqw;width:1.7cqw;height:1.7cqw;border-radius:50%;display:grid;place-items:center;font:800 1.05cqw/1 var(--body)}
.players .av.ok{border-color:var(--amber)}
.players .av.ok::after{content:"✓";background:var(--amber);color:var(--amber-ink)}
.players .av.yes{border-color:var(--good)}
.players .av.yes::after{content:"✓";background:var(--good);color:var(--good-ink)}
.players .av.no{border-color:var(--bad)}
.players .av.no::after{content:"✕";background:var(--bad);color:#fff}
.players .lbl{margin-left:auto;font-weight:700;color:var(--amber);white-space:nowrap}
.players .lbl.soft{color:var(--soft)}

/* lobby */
.lobby{display:grid;grid-template-columns:27cqw 1fr;gap:3cqw;height:100%;min-height:0}
.join{display:flex;flex-direction:column;gap:1.1cqw;min-width:0}
.brand .eyebrow{font:600 1.2cqw/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.brand h1{font:800 3.6cqw/1 var(--display);margin:.7cqw 0 0;letter-spacing:-.02em}
.qr{background:#fff;border-radius:1.2cqw;padding:1.1cqw;width:20cqw;aspect-ratio:1;display:grid;place-items:center}
.qr canvas,.qr img{width:100%!important;height:auto!important;image-rendering:pixelated}
.url{font:600 1.35cqw/1.35 var(--body);color:var(--soft);word-break:break-all}
.code{display:flex;align-items:baseline;gap:1cqw;font:600 1.3cqw/1 var(--body);color:var(--soft)}
.code b{font:800 3.4cqw/1 var(--display);letter-spacing:.18em;color:var(--amber)}
.online{font:700 1.5cqw/1 var(--body)}
.online span{color:var(--amber)}
.groups{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:1.2cqw;align-content:start;min-height:0;overflow:auto}
.gcard{border:.15cqw solid var(--line);border-radius:1.2cqw;background:rgb(255 255 255 / .035);padding:1.1cqw 1.2cqw;display:flex;flex-direction:column;gap:.9cqw;text-align:left;min-width:0}
.gcard .grp{font-size:1.5cqw}
.gcard .gnum{width:2.6cqw;height:2.6cqw;font-size:1.4cqw;border-radius:.6cqw}
.gcard .mem{display:flex;flex-wrap:wrap;gap:.5cqw}
.gcard .mem .av{width:2.7cqw;height:2.7cqw;font-size:.95cqw;border-width:.18cqw}
.gcard .mem .av:not(.on){opacity:.35}
.gcard .foot{display:flex;align-items:center;justify-content:space-between;gap:1cqw;margin-top:auto;font:600 1.15cqw/1.2 var(--body);color:var(--soft)}
.gcard.done{border-color:rgb(124 227 168 / .5)}
.gcard.done .foot{color:var(--good-hi)}
.gbtn{border:0;border-radius:3cqw;padding:.7cqw 1.4cqw;font:700 1.2cqw/1 var(--body);background:var(--amber);color:var(--amber-ink);cursor:pointer;white-space:nowrap}
.gbtn.ghost{background:transparent;border:.15cqw solid var(--line);color:var(--soft)}
.stats{font:500 1.1cqw/1.4 var(--body);color:var(--soft)}
.empty{border:.15cqw dashed var(--line);border-radius:1.2cqw;padding:2.4cqw;font-size:1.7cqw;color:var(--soft);display:grid;gap:1.4cqw;align-content:start}
.empty strong{color:var(--ink);font:800 2.4cqw/1.1 var(--display)}

/* group result + standings */
.res{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;align-items:center;height:100%}
.hero{display:flex;flex-direction:column;align-items:center;gap:1.6cqw;text-align:center}
.hero .av{width:16cqw;height:16cqw;font-size:5cqw;border:.5cqw solid var(--amber);box-shadow:0 0 4cqw rgb(255 181 71 / .4)}
.hero .kick{font:600 1.6cqw/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.hero h2{font:800 4.4cqw/1.05 var(--display);margin:0;text-wrap:balance}
.hero p{margin:0;font:600 1.8cqw/1.3 var(--body);color:var(--soft)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:.6cqw;max-height:44cqw;overflow:auto}
.rank li{display:grid;grid-template-columns:3cqw 3.4cqw 1fr auto auto;align-items:center;gap:1.2cqw;padding:.7cqw 1.2cqw;border-radius:3cqw;background:rgb(255 255 255 / .04);font:600 1.6cqw/1.1 var(--body);font-variant-numeric:tabular-nums}
.rank li .av{width:3.4cqw;height:3.4cqw;font-size:1.15cqw;border-width:.18cqw}
.rank li .pos{font:800 1.6cqw/1 var(--display);color:var(--soft);text-align:center}
.rank li .sc{font:800 1.8cqw/1 var(--display)}
.rank li .tm{color:var(--soft);font-size:1.3cqw;min-width:6cqw;text-align:right}
.rank li.win{background:linear-gradient(90deg,rgb(255 181 71 / .28),rgb(255 181 71 / .08));outline:.15cqw solid var(--amber)}
.rank li.win .pos{color:var(--amber)}
.rank li.pick{cursor:pointer}
.rank li.pick:hover{background:rgb(255 255 255 / .09)}
.hint{font:500 1.15cqw/1.3 var(--body);color:var(--soft);margin-top:.8cqw}

/* final */
.fin{display:grid;grid-template-columns:1fr 24cqw;gap:2.4cqw;height:100%;min-height:0}
.fin .main{display:flex;flex-direction:column;gap:1.6cqw;min-width:0}
.who{display:flex;align-items:center;gap:1.4cqw}
.who .av{width:6cqw;height:6cqw;font-size:2.1cqw;border-width:.3cqw;border-color:var(--amber)}
.who .nm{display:grid;gap:.4cqw;min-width:0}
.who strong{font:800 2.4cqw/1 var(--display)}
.who small{font:500 1.4cqw/1 var(--body);color:var(--soft)}
.who .timer{margin-left:auto}
.life{font:700 1.4cqw/1 var(--body);padding:.8cqw 1.4cqw;border-radius:5cqw;display:inline-flex;align-items:center;gap:.6cqw;background:rgb(255 181 71 / .12);border:.18cqw solid var(--amber);color:var(--amber);cursor:pointer}
.life.used{opacity:.4;border-style:dashed;cursor:default;text-decoration:line-through}
.fin .q{font-size:3cqw}
.fin .a{font-size:1.95cqw;padding:1.3cqw 1.6cqw}
.banner{display:block;padding:1.1cqw 1.6cqw;border-radius:1.2cqw;background:rgb(255 181 71 / .12);border:.15cqw solid rgb(255 181 71 / .5);font:600 1.6cqw/1.3 var(--body)}
.banner b{color:var(--amber)}
.banner.good{background:rgb(47 191 113 / .14);border-color:rgb(124 227 168 / .6)}
.banner.good b{color:var(--good-hi)}
.banner.bad{background:rgb(229 72 77 / .14);border-color:rgb(255 154 158 / .6)}
.banner.bad b{color:var(--bad-hi)}
.ladder{display:flex;flex-direction:column-reverse;gap:.45cqw;justify-content:center;font-variant-numeric:tabular-nums;background:rgb(255 255 255 / .04);border-radius:1.2cqw;padding:1cqw}
.rung{display:flex;justify-content:space-between;align-items:center;padding:.6cqw 1.3cqw;font:700 1.7cqw/1 var(--body);border-radius:3cqw;color:var(--soft);transition:background .4s,color .4s}
.rung em{font-style:normal;opacity:.6;font-weight:600}
.rung.done{color:var(--ink)}
.rung.now{background:var(--amber);color:var(--amber-ink)}
.rung.now em{opacity:.75}
.rung.lost{background:rgb(229 72 77 / .25);color:var(--bad-hi)}
.rung.top{color:var(--amber-hi)}
.rung.top.now{color:var(--amber-ink)}
.order{display:grid;gap:.8cqw;list-style:none;margin:0;padding:0}
.order li{display:flex;align-items:center;gap:1.2cqw;padding:.8cqw 1.4cqw;border-radius:3cqw;background:rgb(255 255 255 / .04);font:600 1.7cqw/1.1 var(--body)}
.order li .av{width:3.6cqw;height:3.6cqw;font-size:1.2cqw;border-width:.18cqw}
.order li small{color:var(--soft);font-weight:500;font-size:1.3cqw}
.order li .pts{margin-left:auto;font:800 1.8cqw/1 var(--display);font-variant-numeric:tabular-nums}
.order li.next{outline:.18cqw solid var(--amber);background:rgb(255 181 71 / .12)}
.order li.gone{opacity:.7}

/* host controls */
.ctl{position:absolute;right:3.4cqw;bottom:1.6cqw;display:flex;gap:.8cqw;z-index:5}
.cbtn{border:.15cqw solid var(--line);background:rgb(12 23 38 / .85);color:var(--ink);border-radius:3cqw;padding:.9cqw 1.8cqw;font:700 1.35cqw/1 var(--body);cursor:pointer;backdrop-filter:blur(6px)}
.cbtn.primary{background:var(--amber);border-color:var(--amber-hi);color:var(--amber-ink)}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn kbd{font:inherit;opacity:.6;margin-left:.6cqw}
.menu{position:absolute;left:3.4cqw;bottom:1.6cqw;z-index:6}
.menu>button{opacity:.5}
.menu>button:hover,.menu.open>button{opacity:1}
.menu .list{position:absolute;left:0;bottom:calc(100% + .8cqw);display:grid;gap:.5cqw;min-width:24cqw;padding:.8cqw;border-radius:1.2cqw;background:#0f1d30;border:.15cqw solid var(--line);box-shadow:0 1cqw 3cqw rgb(0 0 0 / .5)}
.menu .list button{border:0;background:transparent;text-align:left;padding:.8cqw 1cqw;border-radius:.8cqw;font:600 1.3cqw/1.2 var(--body);cursor:pointer}
.menu .list button:hover{background:rgb(255 255 255 / .07)}
.menu .list button.danger{color:var(--bad-hi)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgb(3 7 12 / .7);padding:16px}
.dlg{width:min(640px,100%);background:#0f1d30;border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgb(0 0 0 / .5)}
.dlg h3{margin:0;font:800 24px/1.1 var(--display)}
.dlg p{margin:0;color:var(--soft)}
.dlg textarea,.dlg input{width:100%;background:#0a1524;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:15px/1.4 ui-monospace,Menlo,monospace}
.dlg textarea{min-height:220px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dlg .btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:11px 20px;font:700 15px/1 var(--body);cursor:pointer}
.dlg .btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.dlg .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.dlg .err{color:var(--bad-hi);min-height:1.2em}
.dlg .miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-height:40vh;overflow:auto}
.dlg .miss div{display:flex;align-items:center;gap:10px;font:600 16px/1.2 var(--body);min-width:0}
.dlg .miss .av{width:36px;height:36px;font-size:13px;opacity:.75}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.pin{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
.pin form{display:grid;gap:14px;width:min(360px,100%);text-align:center}
.pin h1{font:800 34px/1.05 var(--display);margin:0}
.pin input{font:800 36px/1 var(--display);letter-spacing:.4em;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--tile2);color:var(--ink);width:100%}
.pin button{border:0;border-radius:999px;padding:16px;font:800 18px/1 var(--body);background:var(--amber);color:var(--amber-ink);cursor:pointer}
.pin .err{color:var(--bad-hi);min-height:1.3em;margin:0}

/* ================= PHONE ================= */
.phone{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.phone .me{display:flex;align-items:center;gap:12px}
.phone .me .av{width:52px;height:52px;font-size:19px;border-width:2px}
.phone .me .nm{display:grid;gap:3px;min-width:0}
.phone .me strong{font:800 21px/1.1 var(--display)}
.phone .me small{font-size:14px;color:var(--soft)}
.phone .me .sw{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--body);cursor:pointer;white-space:nowrap}
.phone .pq{display:flex;justify-content:space-between;align-items:center;font:700 14px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.phone .pq .tm{text-transform:none;font:800 22px/1 var(--display);color:var(--amber);letter-spacing:0;font-variant-numeric:tabular-nums}
.phone .pq .tm.low{color:var(--bad-hi)}
.phone .ptxt{font:800 22px/1.25 var(--display);margin:0;text-wrap:balance}
.phone .btns{display:grid;gap:12px;margin-top:auto}
.phone .btn{display:flex;align-items:center;gap:14px;padding:16px 18px;min-height:62px;font:600 18px/1.2 var(--body);text-align:left;background:linear-gradient(180deg,var(--tile1),var(--tile2));border:2px solid var(--line);border-radius:40px;cursor:pointer;transition:background .2s,opacity .2s}
.phone .btn b{flex:none;width:22px;font:800 20px/1 var(--display);color:var(--amber)}
.phone .btn:disabled{cursor:default}
.phone .btn.sel{background:linear-gradient(180deg,var(--amber),var(--amber2));color:var(--amber-ink);border-color:var(--amber-hi)}
.phone .btn.sel b{color:var(--amber-ink)}
.phone .btn.right{background:linear-gradient(180deg,var(--good),var(--good2));color:var(--good-ink);border-color:var(--good-hi)}
.phone .btn.right b{color:var(--good-ink)}
.phone .btn.wrong{background:linear-gradient(180deg,var(--bad),var(--bad2));color:#fff;border-color:var(--bad-hi)}
.phone .btn.wrong b{color:#fff}
.phone .btn.dim{opacity:.45}
.phone .note{text-align:center;font:700 16px/1.3 var(--body);color:var(--amber);min-height:1.3em}
.phone .note.good{color:var(--good-hi)}
.phone .note.bad{color:var(--bad-hi)}
.phone .note.soft{color:var(--soft);font-weight:600}
.card{border:1px solid var(--line);border-radius:18px;background:rgb(255 255 255 / .04);padding:18px;display:grid;gap:10px}
.card h2{margin:0;font:800 26px/1.1 var(--display);text-wrap:balance}
.card p{margin:0;color:var(--soft)}
.big{font:800 54px/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.phone h1{font:800 30px/1.05 var(--display);margin:6px 0 0;letter-spacing:-.01em}
.phone .eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.find{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--tile2);color:var(--ink);font:500 17px/1 var(--body)}
.who-list{display:grid;gap:18px}
.who-list h3{margin:0 0 8px;font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.who-list .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.nbtn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:rgb(255 255 255 / .03);text-align:left;font:600 15px/1.15 var(--body);cursor:pointer;min-width:0}
.nbtn .av{width:34px;height:34px;font-size:12px}
.nbtn span:last-child{min-width:0;overflow-wrap:anywhere}
.codein{display:grid;gap:12px}
.codein input{font:800 40px/1 var(--display);letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--tile2);color:var(--ink);width:100%}
.codein button,.pbtn{border:0;border-radius:999px;padding:16px;font:800 18px/1 var(--body);background:var(--amber);color:var(--amber-ink);cursor:pointer}
.status{font:600 13px/1.3 var(--body);color:var(--soft);text-align:center}
.status.warn{color:var(--bad-hi)}
.mini{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.mini li{display:flex;align-items:center;gap:10px;font:600 15px/1.2 var(--body)}
.mini li .av{width:30px;height:30px;font-size:11px;border-width:1.5px}
.mini li b{margin-left:auto;font:800 17px/1 var(--display);font-variant-numeric:tabular-nums}
.mini li.mine{color:var(--amber)}
@media (prefers-reduced-motion: reduce){.a.sel{animation:none}.a,.rung,.a .bar{transition:none}}
</style>

/* ---------- network: Supabase Realtime, or tabs of this browser for testing (?local) ---------- */
const LOCAL = /[?&]local\b/.test(location.search) || SUPA_URL.startsWith("__") || !window.supabase;
const ROOM = code => `ras-quiz-${BUILD}-${code}`;
function makeNet(room, meta){
  const h = {};
  if (!LOCAL){
    const client = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const ch = client.channel(room, {config: {presence: {key: meta.id}, broadcast: {self: false}}});
    let ready = false, cur = meta;
    ch.on("presence", {event: "sync"}, () => h.presence && h.presence(Object.values(ch.presenceState()).map(a => a[0]).filter(p => p && p.id)));
    ["state", "action"].forEach(ev => ch.on("broadcast", {event: ev}, ({payload}) => h[ev] && h[ev](payload)));
    ch.subscribe(async s => {
      if (s === "SUBSCRIBED"){ ready = true; await ch.track(cur); h.ready && h.ready(); }
      else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT" || s === "CLOSED") ready = false;
    });
    return {
      send(ev, payload){ if (ready) ch.send({type: "broadcast", event: ev, payload}); },
      track(m){ cur = m; if (ready) ch.track(m); },
      on(ev, cb){ h[ev] = cb; },
      get ready(){ return ready; }
    };
  }
  const bc = new BroadcastChannel(room), peers = new Map();
  let me = meta;
  const emit = () => h.presence && h.presence([...peers.values()].map(p => p.p).concat([me]));
  bc.onmessage = ({data}) => {
    if (data.t === "hb"){ const isNew = !peers.has(data.p.id) || peers.get(data.p.id).p.name !== data.p.name; peers.set(data.p.id, {p: data.p, seen: Date.now()}); if (isNew) emit(); }
    else if (data.t === "bye"){ peers.delete(data.id); emit(); }
    else h[data.t] && h[data.t](data.p);
  };
  setInterval(() => {
    bc.postMessage({t: "hb", p: me});
    const now = Date.now(); let gone = false;
    for (const [k, v] of peers) if (now - v.seen > 3500){ peers.delete(k); gone = true; }
    if (gone) emit();
  }, 1000);
  addEventListener("pagehide", () => bc.postMessage({t: "bye", id: me.id}));
  setTimeout(() => { bc.postMessage({t: "hb", p: me}); emit(); h.ready && h.ready(); }, 50);
  return {send(t, p){ bc.postMessage({t, p}); }, track(m){ me = m; bc.postMessage({t: "hb", p: me}); emit(); }, on(t, cb){ h[t] = cb; }, ready: true};
}

/* ---------- timer ring ---------- */
function ring(remain, total, paused){
  const r = 44, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, remain / total));
  const low = remain <= 5000 && !paused;
  return `<div class="timer${low ? " low" : ""}${paused ? " paused" : ""}" data-timer><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="${r}"/><circle class="arc" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg><span>${paused ? "II" : Math.ceil(remain / 1000)}</span></div>`;
}
function updateRing(el, remain, total, paused){
  if (!el) return;
  const r = 44, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, remain / total));
  el.querySelector(".arc").setAttribute("stroke-dashoffset", c * (1 - f));
  el.querySelector("span").textContent = paused ? "II" : Math.ceil(remain / 1000);
  el.classList.toggle("low", remain <= 5000 && !paused);
  el.classList.toggle("paused", !!paused);
}

/* ---------- confetti ---------- */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#fx"), ctx = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ["#ffb547", "#ffd38f", "#7ce3a8", "#8fb3d9", "#ffffff", "#e8952a"], parts = [];
  for (let i = 0; i < 240; i++){
    const left = i % 2 === 0;
    parts.push({x: left ? -10 : innerWidth + 10, y: innerHeight * (.55 + Math.random() * .35), vx: (left ? 1 : -1) * (5 + Math.random() * 9), vy: -(8 + Math.random() * 10),
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .5, col: cols[i % cols.length]});
  }
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(t / 110 + p.r)); ctx.restore(); });
    if (t - t0 < 3400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

   HOST: runs the quiz on the big screen and is the only one that changes state

async function sha256(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }

async function hostMain(){
  if (store.get("rq-host") !== PIN_HASH){
    app.innerHTML = `<div class="pin"><form id="pinf"><div class="qn">The Big RAS Quiz</div><h1>Host PIN</h1>
      <input id="pinv" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Host PIN" autofocus>
      <p class="err" id="pine"></p><button type="submit">Open the host screen</button></form></div>`;
    await new Promise(resolve => $("#pinf").addEventListener("submit", async e => {
      e.preventDefault();
      if (await sha256("rq26:" + $("#pinv").value.trim()) === PIN_HASH){ store.set("rq-host", PIN_HASH); resolve(); }
      else { $("#pine").textContent = "That PIN is not right. Try again."; $("#pinv").select(); }
    }));
  }
  startHost();
}

function decodeBank(){
  const key = "ras-retreat-2026";
  const bin = atob(BANK), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function startHost(){
  const bank = decodeBank(), byId = new Map(bank.map(q => [q.id, q]));
  const HKEY = "rq-host-state";
  const newCode = () => Array.from({length: 4}, () => "ACDEFHJKMNPRTWXY"[rnd(16)]).join("");
  const fresh = () => ({code: newCode(), groups: [], groupsAt: 0, used: [], results: {}, phase: "lobby", cur: null, final: null});
  let H; try { H = JSON.parse(store.get(HKEY)) || fresh(); } catch (e){ H = fresh(); }
  const save = () => store.set(HKEY, JSON.stringify(H));
  const ME = {id: "host-" + Math.random().toString(36).slice(2, 8), host: true, at: Date.now()};
  let seq = 0, net = null, armed = 0, pending = null, menuOpen = false;

  /* groups from the dealing page (same browser), or pasted */
  function savedGroups(){
    try { const s = JSON.parse(store.get("ras26-groups")); if (s && s.groups && s.groups.length) return s; } catch (e){}
    return null;
  }
  function setGroups(list, at){
    H.groups = list.map((g, i) => ({g: i, name: g.name, members: g.members.filter(m => PEOPLE.includes(m))}));
    H.groupsAt = at || Date.now();
    save();
  }
  function maybeImport(){
    const s = savedGroups();
    if (s && s.at > H.groupsAt && !Object.keys(H.results).length && H.phase === "lobby"){ setGroups(s.groups, s.at); return true; }
    return false;
  }
  maybeImport();
  function parsePasted(text){
    const out = []; let cur = null;
    const byShown = new Map(PEOPLE.map(p => [shown(p).toLowerCase(), p]));
    for (const raw of text.split(/\r?\n/)){
      const line = raw.trim();
      const m = line.match(/^Group\s+\d+\s*[·.:-]\s*(.+?)(\s*\(\d+\))?$/i);
      if (m){ cur = {name: m[1].trim(), members: []}; out.push(cur); continue; }
      const n = line.match(/^-\s*(.+)$/);
      if (n && cur){ const name = n[1].replace(/[\[\]]/g, "").trim().toLowerCase(); if (byShown.has(name)) cur.members.push(byShown.get(name)); }
    }
    return out.filter(g => g.members.length);
  }

  /* presence */
  const known = new Map(); let listed = new Set();
  function onPresence(list){ listed = new Set(list.map(p => p.id)); const now = Date.now(); list.forEach(p => known.set(p.id, {p, seen: now})); }
  function onlineNames(){
    const now = Date.now(), s = new Set();
    for (const id of listed){ const v = known.get(id); if (v) v.seen = now; }
    for (const [id, v] of known){ if (now - v.seen > GRACE) known.delete(id); else if (v.p.name) s.add(v.p.name); }
    return s;
  }

  /* questions */
  function draw(lv){
    const used = new Set(H.used), tryOrder = lv === 1 ? [1, 2, 3] : lv === 2 ? [2, 1, 3] : [3, 2, 1];
    for (const l of tryOrder){
      const pool = bank.filter(q => q.lv === l && !used.has(q.id));
      if (pool.length){ const q = pool[rnd(pool.length)]; H.used.push(q.id); return q.id; }
    }
    const q = bank[rnd(bank.length)]; return q.id;   // bank exhausted: repeat rather than stop the show
  }
  function arrange(q){
    const idx = [0, 1, 2, 3];
    const num = s => parseFloat(s.replace(/\s/g, "").replace(/,/g, ""));
    if (q.o.every(o => /^-?\d/.test(o))) return idx.sort((a, b) => num(q.o[a]) - num(q.o[b]));
    return shuffle(idx);
  }
  const left = lv => bank.filter(q => q.lv === lv && !H.used.includes(q.id)).length;

  /* ----- group round ----- */
  function startGroup(g){
    const grp = H.groups[g];
    H.cur = {g, i: 0, qs: GROUP_LEVELS.map(draw), score: {}, time: {}, seen: [], last: null};
    grp.members.forEach(m => { H.cur.score[m] = 0; H.cur.time[m] = 0; });
    startQ();
  }
  function startQ(){
    const c = H.cur, q = byId.get(c.qs[c.i]);
    c.qid = q.id; c.opts = arrange(q); c.answers = {}; c.start = Date.now(); c.deadline = c.start + Q_TIME; c.last = null;
    H.phase = "q"; armed = 0; save(); render(); publish();
  }
  function revealQ(){
    const c = H.cur, q = byId.get(c.qid), correct = c.opts.indexOf(q.a);
    const dist = [0, 0, 0, 0], right = [], wrong = [];
    for (const [name, a] of Object.entries(c.answers)){
      dist[a.c]++;
      if (!c.seen.includes(name)) c.seen.push(name);
      if (a.c === correct){ c.score[name] = (c.score[name] || 0) + 1; right.push(name); } else wrong.push(name);
      c.time[name] = (c.time[name] || 0) + a.t;
    }
    // anyone who has played this round but missed this question gets the full time added
    c.seen.forEach(n => { if (!c.answers[n]) c.time[n] = (c.time[n] || 0) + Q_TIME; });
    c.last = {correct, dist, right, wrong};
    H.phase = "reveal"; save(); render(); publish();
  }
  function nextQ(){
    const c = H.cur;
    if (c.i < c.qs.length - 1){ c.i++; startQ(); return; }
    const ranking = c.seen.map(n => ({name: n, score: c.score[n] || 0, time: c.time[n] || 0})).sort((a, b) => b.score - a.score || a.time - b.time);
    H.results[c.g] = {ranking, winner: ranking.length ? ranking[0].name : null};
    H.phase = "gresult"; save(); render(); publish(); confetti();
  }
  function toLobby(){ H.phase = "lobby"; H.cur = null; save(); render(); publish(); }

  /* ----- final ----- */
  function finalists(){ return H.groups.filter(g => H.results[g.g] && H.results[g.g].winner).map(g => ({name: H.results[g.g].winner, g: g.g})); }
  function startFinal(){
    const list = shuffle(finalists());
    H.final = {order: list.map(f => f.name), idx: 0, st: {}};
    list.forEach(f => H.final.st[f.name] = {g: f.g, points: 0, rung: 0, time: 0, out: false, done: false, life: false});
    H.phase = "fintro"; H.cur = null; save(); render(); publish();
  }
  function askF(){
    const F = H.final, name = F.order[F.idx], st = F.st[name];
    const q = byId.get(draw(LADDER_LV[st.rung]));
    F.cur = {name, rung: st.rung, qid: q.id, opts: arrange(q), start: Date.now(), deadline: Date.now() + Q_TIME, paused: null, pick: null, lockAt: 0, ok: null};
    H.phase = "fq"; pending = null; save(); render(); publish();
  }
  function lockF(c){
    const F = H.final, f = F.cur;
    if (H.phase !== "fq" || f.pick !== null) return;
    f.pick = c; const used = Q_TIME - (f.paused !== null ? f.paused : Math.max(0, f.deadline - Date.now()));
    f.paused = null;
    F.st[f.name].time += used; f.lockAt = Date.now();
    H.phase = "flock"; pending = null; save(); render(); publish();
  }
  function revealF(){
    const F = H.final, f = F.cur, st = F.st[f.name], q = byId.get(f.qid);
    const correct = f.opts.indexOf(q.a);
    f.correct = correct; f.ok = f.pick === correct;
    if (f.ok){ st.points = LADDER[f.rung]; st.rung = f.rung + 1; if (st.rung >= LADDER.length) st.done = true; }
    else { st.out = true; st.done = true; }
    H.phase = "freveal"; save(); render(); publish();
    if (f.ok && st.done) confetti();
  }
  function nextF(){
    const F = H.final, st = F.st[F.cur.name];
    if (!st.done){ askF(); return; }
    F.idx++; F.cur = null;
    H.phase = F.idx < F.order.length ? "fintro" : "champion";
    save(); render(); publish();
    if (H.phase === "champion") confetti();
  }
  function lifeline(){
    const F = H.final, f = F.cur, st = F.st[f.name];
    if (H.phase !== "fq") return;
    if (f.paused === null && !st.life){ st.life = true; f.paused = Math.max(0, f.deadline - Date.now()); }
    else if (f.paused !== null){ f.deadline = Date.now() + f.paused; f.paused = null; }
    save(); render(); publish();
  }
  function standings(){
    const F = H.final; if (!F) return [];
    return F.order.map(n => ({name: n, ...F.st[n]})).sort((a, b) => b.points - a.points || a.time - b.time);
  }

  /* ----- actions from phones ----- */
  function onAction(a){
    if (!a || !a.type) return;
    if (a.type === "hello"){ publish(); return; }
    if (a.type === "answer"){
      if (H.phase === "q" && H.cur && a.qid === H.cur.qid && H.groups[H.cur.g].members.includes(a.name) && !H.cur.answers[a.name] && a.c >= 0 && a.c < 4){
        H.cur.answers[a.name] = {c: a.c, t: Math.min(Q_TIME, Date.now() - H.cur.start)};
        save(); render(); publish();
      } else if (H.phase === "fq" && H.final && H.final.cur && H.final.cur.name === a.name && a.qid === H.final.cur.qid) lockF(a.c);
      else publish();
    }
  }

  /* ----- public state for phones ----- */
  function publish(){
    if (!net) return;
    const S = {seq: ++seq, at: Date.now(), phase: H.phase, code: H.code,
      groups: H.groups.map(g => ({g: g.g, name: g.name, members: g.members})),
      results: Object.fromEntries(Object.entries(H.results).map(([g, r]) => [g, {winner: r.winner}]))};
    const c = H.cur;
    if (c && (H.phase === "q" || H.phase === "reveal")){
      const q = byId.get(c.qid);
      S.cur = {g: c.g, i: c.i, n: c.qs.length, qid: c.qid, text: q.t, opts: c.opts.map(k => q.o[k]),
        remain: H.phase === "q" ? Math.max(0, c.deadline - Date.now()) : 0, answered: Object.keys(c.answers)};
      if (H.phase === "reveal") Object.assign(S.cur, {correct: c.last.correct, dist: c.last.dist, right: c.last.right, score: c.score});
    }
    if (H.phase === "gresult" && c) S.gres = {g: c.g, ...H.results[c.g]};
    if (H.final){
      S.stand = standings().map(s => ({name: s.name, g: s.g, points: s.points, rung: s.rung, done: s.done, out: s.out}));
      S.forder = H.final.order; S.fidx = H.final.idx;
      const f = H.final.cur;
      if (f && ["fq", "flock", "freveal"].includes(H.phase)){
        const q = byId.get(f.qid);
        S.fin = {name: f.name, rung: f.rung, qid: f.qid, text: q.t, opts: f.opts.map(k => q.o[k]), pick: f.pick,
          remain: f.paused !== null ? f.paused : Math.max(0, f.deadline - Date.now()), paused: f.paused !== null,
          life: H.final.st[f.name].life, points: H.final.st[f.name].points};
        if (H.phase === "freveal") Object.assign(S.fin, {correct: f.correct, ok: f.ok});
      }
    }
    net.send("state", S);
  }

  /* ----- clock ----- */
  function tick(){
    const now = Date.now();
    if (H.phase === "q" && H.cur){
      const c = H.cur, on = onlineNames(), members = H.groups[c.g].members;
      const live = members.filter(m => on.has(m) || c.answers[m]);
      const all = live.length > 0 && live.every(m => c.answers[m]);
      if (now >= c.deadline) revealQ();
      else if (all){ if (!armed) armed = now; else if (now - armed > 700) revealQ(); }
      else armed = 0;
      updateRing($("[data-timer]"), c.deadline - now, Q_TIME, false);
    }
    if (H.phase === "fq" && H.final && H.final.cur){
      const f = H.final.cur;
      if (f.paused === null && now >= f.deadline){ f.pick = -1; H.final.st[f.name].time += Q_TIME; revealF(); return; }
      updateRing($("[data-timer]"), f.paused !== null ? f.paused : f.deadline - now, Q_TIME, f.paused !== null);
    }
    if (H.phase === "flock" && H.final && now - H.final.cur.lockAt > 2400) revealF();
  }

  /* ----- rendering ----- */
  let lastOnlineKey = "";
  function render(){
    const on = onlineNames();
    lastOnlineKey = [...on].sort().join("|");
    const P = H.phase;
    let body = "", ctl = "";
    if (P === "lobby"){ body = lobbyView(on); ctl = H.groups.length ? `<button class="cbtn primary" data-act="final"${finalists().length ? "" : " disabled"}>Start the final</button>` : ""; }
    else if (P === "q" || P === "reveal"){ body = questionView(on); ctl = P === "q" ? `<button class="cbtn" data-act="reveal">Reveal now <kbd>↵</kbd></button>` : `<button class="cbtn primary" data-act="next">${H.cur.i < H.cur.qs.length - 1 ? "Next question" : "Group results"} <kbd>↵</kbd></button>`; }
    else if (P === "gresult"){ body = groupResultView(); ctl = `<button class="cbtn primary" data-act="lobby">Back to groups <kbd>↵</kbd></button>`; }
    else if (P === "fintro"){ body = finalIntroView(); ctl = `<button class="cbtn primary" data-act="climb">Start ${esc(firstName(H.final.order[H.final.idx]))}’s climb <kbd>↵</kbd></button>`; }
    else if (["fq", "flock", "freveal"].includes(P)){
      body = finalView();
      const f = H.final.cur, st = H.final.st[f.name];
      if (P === "fq") ctl = f.paused !== null ? `<button class="cbtn primary" data-act="life">Resume the timer <kbd>↵</kbd></button>` : "";
      if (P === "freveal") ctl = `<button class="cbtn primary" data-act="nextf">${!st.done ? "Next question" : H.final.idx < H.final.order.length - 1 ? "Next finalist" : "Final standings"} <kbd>↵</kbd></button>`;
    }
    else if (P === "champion"){ body = championView(); ctl = `<button class="cbtn" data-act="lobby">Back to groups</button>`; }
    const menu = `<div class="menu${menuOpen ? " open" : ""}"><button class="cbtn" data-act="menu" aria-expanded="${menuOpen}">Menu</button>${menuOpen ? `<div class="list">
      ${P !== "lobby" ? `<button data-act="abandon">Stop and go back to the groups</button>` : ""}
      ${P === "lobby" && savedGroups() ? `<button data-act="reimport">Load groups from the dealing page</button>` : ""}
      ${P === "lobby" ? `<button data-act="paste">Paste groups</button>` : ""}
      <button data-act="fullscreen">Full screen</button>
      <button class="danger" data-act="reset">Start a new quiz…</button></div>` : ""}</div>`;
    app.innerHTML = `<div class="host"><div class="box"><div class="scr">${body}</div><div class="ctl">${ctl}</div>${menu}</div></div>`;
    if (P === "lobby") drawQR();
  }
  function joinUrl(){ return location.origin + location.pathname + "#" + H.code; }
  let qrSrc = null;
  function drawQR(){
    const el = $("#qr"); if (!el || !window.QRCode) return;
    if (!qrSrc){
      const tmp = document.createElement("div");
      new QRCode(tmp, {text: joinUrl(), width: 512, height: 512, colorDark: "#0c1726", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M});
      const cv = tmp.querySelector("canvas"); qrSrc = cv ? cv.toDataURL() : (tmp.querySelector("img") || {}).src;
    }
    if (qrSrc) el.innerHTML = `<img src="${qrSrc}" alt="QR code to join the quiz">`;
  }
  function lobbyView(on){
    const shortUrl = (location.host + location.pathname).replace(/^www\./, "").replace(/\/$/, "");
    const total = H.groups.reduce((s, g) => s + g.members.length, 0);
    const joined = H.groups.reduce((s, g) => s + g.members.filter(m => on.has(m)).length, 0);
    const cols = H.groups.length <= 4 ? 2 : H.groups.length <= 9 ? 3 : 4;
    const groups = H.groups.length ? `<div class="groups" style="--cols:${cols}">${H.groups.map(g => {
      const r = H.results[g.g];
      return `<div class="gcard${r ? " done" : ""}"><div class="grp" style="--h:${hueFor(g.g)}"><span class="gnum">${g.g + 1}</span><span>${esc(g.name)}</span></div>
        <div class="mem">${g.members.map(m => av(m, on.has(m) ? "on" : "")).join("")}</div>
        <div class="foot">${r ? `<span>Winner: ${esc(r.winner ? shown(r.winner) : "nobody")}</span><button class="gbtn ghost" data-act="start" data-g="${g.g}">Play again</button>`
          : `<span>${g.members.filter(m => on.has(m)).length} of ${g.members.length} joined</span><button class="gbtn" data-act="start" data-g="${g.g}">Start</button>`}</div></div>`;
    }).join("")}</div>`
      : `<div class="empty"><strong>No groups yet</strong><span>Deal the groups on the grouping page in this browser, then come back here. Or open the menu and paste the text from “Copy groups”.</span></div>`;
    return `<div class="lobby"><div class="join">
        <div class="brand"><div class="eyebrow">RAS Team Retreat · 25 Nov 2026</div><h1>The Big RAS Quiz</h1></div>
        <div class="qr" id="qr"></div>
        <div class="url">Scan, or open <b>${esc(shortUrl)}</b> and type the code</div>
        <div class="code">Code <b>${esc(H.code)}</b></div>
        <div class="online"><span>${joined}</span> of ${total} phones connected</div>
        <div class="stats">Questions left · easy ${left(1)} · medium ${left(2)} · hard ${left(3)}</div>
      </div>${groups}</div>`;
  }
  function questionView(on){
    const c = H.cur, g = H.groups[c.g], q = byId.get(c.qid), rev = H.phase === "reveal" ? c.last : null;
    const total = Object.keys(c.answers).length || 1;
    const opts = c.opts.map((k, d) => {
      const cls = rev ? (d === rev.correct ? " right" : " dim") : "";
      const n = rev ? rev.dist[d] : 0;
      return `<div class="a${cls}">${rev ? `<span class="bar" style="width:${Math.round(n / total * 100)}%"></span>` : ""}<b>${LETTERS[d]}</b><span class="t">${esc(q.o[k])}</span>${rev ? `<span class="n">${n}</span>` : ""}</div>`;
    }).join("");
    const answered = Object.keys(c.answers).length, live = g.members.filter(m => on.has(m) || c.answers[m]).length;
    const players = g.members.map(m => {
      let cls = on.has(m) || c.answers[m] ? "" : "off";
      if (rev){ if (rev.right.includes(m)) cls = "yes"; else if (rev.wrong.includes(m)) cls = "no"; }
      else if (c.answers[m]) cls = "ok";
      return av(m, cls);
    }).join("");
    const lbl = rev ? `<span class="lbl">${rev.right.length} of ${answered} right</span>` : `<span class="lbl">${answered} of ${live} locked in</span>`;
    return `<div class="top"><div class="grp" style="--h:${hueFor(g.g)}"><span class="gnum">${g.g + 1}</span><span>${esc(g.name)}</span></div>
      <div class="qn">Question ${c.i + 1} of ${c.qs.length}</div>${rev ? `<div class="timer"><span>✓</span></div>` : ring(c.deadline - Date.now(), Q_TIME, false)}</div>
      <h2 class="q">${esc(q.t)}</h2><div class="ans">${opts}</div><div class="players">${players}${lbl}</div>`;
  }
  function groupResultView(){
    const c = H.cur, g = H.groups[c.g], r = H.results[c.g];
    const w = r.winner, wr = r.ranking.find(x => x.name === w);
    const rows = r.ranking.map((x, i) => `<li class="pick${x.name === w ? " win" : ""}" data-act="winner" data-name="${esc(x.name)}"><span class="pos">${i + 1}</span>${av(x.name)}<span>${esc(shown(x.name))}</span><span class="sc">${x.score}/${c.qs.length}</span><span class="tm">${secs(x.time)}</span></li>`).join("");
    return `<div class="top"><div class="grp" style="--h:${hueFor(g.g)}"><span class="gnum">${g.g + 1}</span><span>${esc(g.name)}</span></div><div class="qn">Group results</div></div>
      <div class="res">${w ? `<div class="hero">${av(w)}<div class="kick">Into the final</div><h2>${esc(shown(w))}</h2><p>${wr.score} of ${c.qs.length} right · ${secs(wr.time)} total</p></div>`
        : `<div class="hero"><h2>Nobody answered</h2><p>Check that phones are connected, then play the group again.</p></div>`}
      <div><ol class="rank">${rows}</ol><div class="hint">Same score: the faster total time wins. Click a name to send someone else to the final.</div></div></div>`;
  }
  function ladderView(name, f){
    const st = H.final.st[name];
    return `<div class="ladder">${LADDER.map((v, i) => {
      let cls = i < st.rung ? " done" : "";
      if (f && i === f.rung){ cls = H.phase === "freveal" && !f.ok ? " lost" : " now"; }
      if (i === LADDER.length - 1) cls += " top";
      return `<div class="rung${cls}"><em>${i + 1}</em>${fmt(v)} pts</div>`;
    }).join("")}</div>`;
  }
  function finalIntroView(){
    const F = H.final, next = F.order[F.idx];
    const list = F.order.map((n, i) => { const s = F.st[n]; return `<li class="${i === F.idx ? "next" : i < F.idx ? "gone" : ""}">${av(n)}<span>${esc(shown(n))}<br><small>Group ${s.g + 1} · ${esc(H.groups[s.g].name)}</small></span><span class="pts">${i < F.idx ? fmt(s.points) + " pts" : i === F.idx ? "Up next" : ""}</span></li>`; }).join("");
    return `<div class="top"><div class="qn">The final · finalist ${F.idx + 1} of ${F.order.length}</div></div>
      <div class="res"><div class="hero">${av(next)}<div class="kick">Up next</div><h2>${esc(shown(next))}</h2><p>Ten questions, each one harder. A wrong answer ends the climb and keeps the points already won. One “ask the audience”.</p></div>
      <div><ol class="order">${list}</ol></div></div>`;
  }
  function finalView(){
    const F = H.final, f = F.cur, st = F.st[f.name], q = byId.get(f.qid), P = H.phase;
    const opts = f.opts.map((k, d) => {
      let cls = "";
      if (P === "flock" && d === f.pick) cls = " sel";
      if (P === "fq" && pending === d) cls = " pending";
      if (P === "freveal"){ if (d === f.correct) cls = " right"; else if (d === f.pick) cls = " wrong"; else cls = " dim"; }
      const tag = P === "fq" ? "button" : "div";
      return `<${tag} class="a${cls}"${P === "fq" ? ` data-act="pick" data-c="${d}"` : ""}><b>${LETTERS[d]}</b><span class="t">${esc(q.o[k])}</span></${tag}>`;
    }).join("");
    let banner = "";
    if (P === "fq" && f.paused !== null) banner = `<div class="banner"><b>Ask the audience.</b> The room gives advice out loud; ${esc(firstName(f.name))} decides. The timer is paused.</div>`;
    else if (P === "fq" && pending !== null) banner = `<div class="banner">Click <b>${LETTERS[pending]}</b> again to lock it in for ${esc(firstName(f.name))}.</div>`;
    else if (P === "flock") banner = `<div class="banner"><b>${LETTERS[f.pick]}</b> is locked in…</div>`;
    else if (P === "freveal") banner = f.ok
      ? `<div class="banner good"><b>Correct!</b> ${fmt(st.points)} points${st.done ? " · the top of the ladder!" : ""}</div>`
      : `<div class="banner bad"><b>${f.pick < 0 ? "Time’s up." : "Wrong answer."}</b> The climb ends on ${fmt(st.points)} points. The answer was ${LETTERS[f.correct]}.</div>`;
    const life = `<button class="life${st.life && f.paused === null ? " used" : ""}" data-act="life"${P !== "fq" || (st.life && f.paused === null) ? " disabled" : ""}>Ask the audience${f.paused !== null ? " · in use" : st.life ? " · used" : ""}</button>`;
    const timer = P === "fq" ? ring(f.paused !== null ? f.paused : f.deadline - Date.now(), Q_TIME, f.paused !== null) : `<div class="timer"><span>${P === "freveal" ? (f.ok ? "✓" : "✕") : "…"}</span></div>`;
    return `<div class="fin"><div class="main">
        <div class="who">${av(f.name)}<div class="nm"><strong>${esc(shown(f.name))}</strong><small>Winner of Group ${st.g + 1} · ${esc(H.groups[st.g].name)}</small></div>${timer}</div>
        <div class="top"><div class="qn">Question ${f.rung + 1} · for ${fmt(LADDER[f.rung])} points</div>${life}</div>
        <h2 class="q">${esc(q.t)}</h2>${banner}<div class="ans">${opts}</div>
      </div>${ladderView(f.name, f)}</div>`;
  }
  function championView(){
    const st = standings(), w = st[0];
    const rows = st.map((s, i) => `<li class="${i === 0 ? "win" : ""}"><span class="pos">${i + 1}</span>${av(s.name)}<span>${esc(shown(s.name))}</span><span class="sc">${fmt(s.points)}</span><span class="tm">${secs(s.time)}</span></li>`).join("");
    return `<div class="top"><div class="qn">The final · standings</div></div>
      <div class="res">${w ? `<div class="hero">${av(w.name)}<div class="kick">Champion of the Big RAS Quiz</div><h2>${esc(shown(w.name))}</h2><p>${fmt(w.points)} points · Group ${w.g + 1} · ${esc(H.groups[w.g].name)}</p></div>` : "<div></div>"}
      <div><ol class="rank">${rows}</ol><div class="hint">Same points: the faster total answer time wins.</div></div></div>`;
  }

  /* ----- dialogs ----- */
  function dialog(html, onOk){
    const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="dlg">${html}</div>`;
    document.body.append(m);
    const close = () => m.remove();
    m.addEventListener("click", e => { if (e.target === m || e.target.dataset.x === "cancel") close(); if (e.target.dataset.x === "ok") onOk(m, close); });
    const f = m.querySelector("textarea,input"); if (f) f.focus();
  }

  /* ----- input ----- */
  function act(name, el){
    if (name === "menu"){ menuOpen = !menuOpen; render(); return; }
    menuOpen = false;
    switch (name){
      case "start": {
        const g = +el.dataset.g, grp = H.groups[g], on = onlineNames();
        const missing = grp.members.filter(m => !on.has(m));
        if (!missing.length){ startGroup(g); break; }
        const n = missing.length;
        dialog(`<h3>${n} ${n > 1 ? "people" : "person"} in Group ${g + 1} ${n > 1 ? "haven’t" : "hasn’t"} joined</h3>
          <div class="miss">${missing.map(m => `<div>${av(m)}<span>${esc(shown(m))}</span></div>`).join("")}</div>
          <p>They can still join while the group is playing, but they will miss the questions shown before they join.</p>
          <div class="row"><button class="btn" data-x="cancel">Wait for them</button><button class="btn primary" data-x="ok">Start anyway</button></div>`,
          (m, close) => { close(); if (H.phase === "lobby") startGroup(g); });
        render(); break;
      }
      case "reveal": if (H.phase === "q") revealQ(); break;
      case "next": if (H.phase === "reveal") nextQ(); break;
      case "lobby": toLobby(); break;
      case "winner": if (H.phase === "gresult"){ H.results[H.cur.g].winner = el.dataset.name; save(); render(); publish(); } break;
      case "final": {
        const missing = H.groups.filter(g => !H.results[g.g]).length;
        if (!missing){ startFinal(); break; }
        dialog(`<h3>Start the final now?</h3><p>${missing} group${missing > 1 ? "s have" : " has"} not played yet, so ${missing > 1 ? "they" : "it"} will have no finalist.</p><div class="row"><button class="btn" data-x="cancel">Not yet</button><button class="btn primary" data-x="ok">Start the final</button></div>`, (m, close) => { close(); startFinal(); });
        render(); break;
      }
      case "climb": askF(); break;
      case "pick":
        if (H.phase !== "fq") break;
        if (pending === +el.dataset.c) lockF(pending); else { pending = +el.dataset.c; render(); }
        break;
      case "life": lifeline(); break;
      case "nextf": if (H.phase === "freveal") nextF(); break;
      case "abandon":
        dialog(`<h3>Stop this round?</h3><p>Nothing from the current round is kept. Questions already shown stay used.</p><div class="row"><button class="btn" data-x="cancel">Keep playing</button><button class="btn danger" data-x="ok">Stop</button></div>`,
          (m, close) => { close(); if (H.final && ["fintro", "fq", "flock", "freveal", "champion"].includes(H.phase)) H.final = null; toLobby(); });
        render(); break;
      case "reimport": { const s = savedGroups(); if (s){ setGroups(s.groups, s.at); H.results = {}; save(); } render(); publish(); break; }
      case "paste":
        dialog(`<h3>Paste groups</h3><p>On the grouping page, press “Copy groups” and paste the text here.</p><textarea id="pasteT" spellcheck="false"></textarea><div class="err" id="pasteE"></div><div class="row"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="ok">Use these groups</button></div>`,
          (m, close) => { const g = parsePasted(m.querySelector("#pasteT").value); if (!g.length){ m.querySelector("#pasteE").textContent = "No groups found. Paste the whole text, starting with “Group 1 · …”."; return; } setGroups(g); H.results = {}; save(); close(); render(); publish(); });
        render(); break;
      case "fullscreen": try { document.documentElement.requestFullscreen(); } catch (e){} render(); break;
      case "reset":
        dialog(`<h3>Start a new quiz?</h3><p>This clears the groups, all results and the list of used questions, and makes a new join code, so phones need to scan again. Then deal the groups again on the grouping page.</p><div class="row"><button class="btn" data-x="cancel">Cancel</button><button class="btn danger" data-x="ok">Start a new quiz</button></div>`,
          (m, close) => { close(); const s = savedGroups(), at = Math.max(H.groupsAt, s ? s.at : 0); H = fresh(); H.groupsAt = at; save(); location.reload(); });
        render(); break;
    }
  }
  app.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && !el.disabled) act(el.dataset.act, el); });
  document.addEventListener("keydown", e => {
    if (document.querySelector(".modal") || e.target.matches("input,textarea")) return;
    if (e.key === "Enter" || e.key === "ArrowRight"){ const b = $(".ctl .cbtn.primary:not(:disabled)") || (H.phase === "q" ? $('.ctl [data-act="reveal"]') : null); if (b){ e.preventDefault(); b.click(); } }
    if (e.key === "Escape" && menuOpen){ menuOpen = false; render(); }
  });
  // Pick up a new deal right away: the dealing page writes to localStorage, which fires "storage" in this tab.
  const refreshGroups = () => { if (maybeImport()){ render(); publish(); } };
  addEventListener("focus", refreshGroups);
  addEventListener("storage", e => { if (e.key === "ras26-groups") refreshGroups(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshGroups(); });

  net = makeNet(ROOM(H.code), ME);
  net.on("presence", list => { onPresence(list); const k = [...onlineNames()].sort().join("|"); if (k !== lastOnlineKey && ["lobby", "q", "reveal"].includes(H.phase)) render(); });
  net.on("action", onAction);
  net.on("ready", publish);
  render();
  setInterval(tick, 200);
  setInterval(publish, 2000);
  setInterval(() => { const k = [...onlineNames()].sort().join("|"); if (k !== lastOnlineKey && ["lobby", "q", "reveal"].includes(H.phase)) render(); }, 1500);
  window.__quiz = {get H(){ return H; }, bank};   // for testing from the console
}

/* ======================================================================
   PHONE: pick your name, answer when it is your turn, watch otherwise
   ====================================================================== */
function phoneMain(){
  let code = (location.hash.slice(1) || "").toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)){
    app.innerHTML = `<div class="phone"><div><div class="eyebrow">RAS Team Retreat</div><h1>The Big RAS Quiz</h1></div>
      <form class="codein" id="cf"><label for="cv">Type the code from the big screen</label><input id="cv" maxlength="4" autocomplete="off" autocapitalize="characters"><button type="submit">Join</button></form></div>`;
    $("#cf").addEventListener("submit", e => { e.preventDefault(); const v = $("#cv").value.trim().toUpperCase(); if (/^[A-Z]{4}$/.test(v)){ location.hash = v; location.reload(); } });
    return;
  }
  const id = store.sget("rq-id") || Math.random().toString(36).slice(2, 10); store.sset("rq-id", id);
  let me = store.get("rq-me") || "", S = null, gotAt = 0, recvAt = 0, filter = "", lastKey = "";
  let mine = {}; try { mine = JSON.parse(store.sget("rq-mine") || "{}"); } catch (e){}
  const net = makeNet(ROOM(code), {id, name: me, at: Date.now()});
  net.on("state", s => { if (S && s.seq < S.seq && s.at <= S.at) return; S = s; gotAt = recvAt = Date.now(); render(); });
  net.on("ready", () => net.send("action", {type: "hello"}));
  setInterval(() => { if (!S || Date.now() - gotAt > 5000) net.send("action", {type: "hello"}); }, 2500);

  const myGroup = () => S && S.groups.find(g => g.members.includes(me));
  function choose(name){ me = name; store.set("rq-me", name); net.track({id, name, at: Date.now()}); lastKey = ""; render(); }
  function answer(qid, c){
    if (mine[qid] !== undefined) return;
    mine[qid] = c; store.sset("rq-mine", JSON.stringify(mine));
    net.send("action", {type: "answer", name: me, qid, c}); lastKey = ""; render();
  }
  // keep re-sending an answer until the host shows it as received
  setInterval(() => {
    if (!S || !me) return;
    if (S.phase === "q" && S.cur && mine[S.cur.qid] !== undefined && !S.cur.answered.includes(me)) net.send("action", {type: "answer", name: me, qid: S.cur.qid, c: mine[S.cur.qid]});
    if (S.phase === "fq" && S.fin && S.fin.name === me && mine[S.fin.qid] !== undefined && S.fin.pick === null) net.send("action", {type: "answer", name: me, qid: S.fin.qid, c: mine[S.fin.qid]});
  }, 1500);

  function head(sub){
    return `<div class="me">${av(me)}<div class="nm"><strong>${esc(shown(me))}</strong><small>${esc(sub)}</small></div><button class="sw" data-act="switch">Not you?</button></div>`;
  }
  function buttons(opts, state){
    return `<div class="btns">${opts.map((o, d) => `<button class="btn${state(d)}" data-act="ans" data-c="${d}"${state.locked ? " disabled" : ""}><b>${LETTERS[d]}</b><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  function render(){
    if (!S){ app.innerHTML = `<div class="phone"><div><div class="eyebrow">RAS Team Retreat</div><h1>The Big RAS Quiz</h1></div><div class="card"><h2>Connecting…</h2><p>Waiting for the big screen. Keep this page open.</p></div></div>`; return; }
    const g = myGroup();
    if (!me || !g) return pickName();
    const P = S.phase, key = JSON.stringify([P, me, S.cur && [S.cur.qid, S.cur.answered.includes(me), S.cur.correct], S.gres && S.gres.winner, S.fin && [S.fin.qid, S.fin.pick, S.fin.paused, S.fin.correct], S.fidx, mine[(S.cur || S.fin || {}).qid], S.results]);
    if (key === lastKey){ tickTimer(); return; }
    lastKey = key;
    const sub = `Group ${g.g + 1} · ${g.name}`;
    let html = head(sub);
    if ((P === "q" || P === "reveal") && S.cur){
      const c = S.cur, inGroup = c.g === g.g, my = mine[c.qid];
      html += `<div class="pq"><span>${inGroup ? `Question ${c.i + 1} of ${c.n}` : `Group ${c.g + 1} is playing · Q${c.i + 1}`}</span>${P === "q" ? `<span class="tm" data-tm></span>` : ""}</div><p class="ptxt">${esc(c.text)}</p>`;
      if (inGroup){
        const locked = my !== undefined || P === "reveal";
        const st = d => P === "reveal" ? (d === c.correct ? " right" : d === my ? " wrong" : " dim") : (d === my ? " sel" : my !== undefined ? " dim" : "");
        st.locked = locked;
        html += buttons(c.opts, st);
        if (P === "q") html += `<div class="note${my === undefined ? " soft" : ""}">${my === undefined ? "Tap your answer. You can’t change it." : c.answered.includes(me) ? `Locked in · ${LETTERS[my]}` : "Sending…"}</div>`;
        else html += `<div class="note ${my === c.correct ? "good" : "bad"}">${my === undefined ? "No answer this time" : my === c.correct ? "Correct!" : `Not this time · it was ${LETTERS[c.correct]}`} · ${(c.score && c.score[me]) || 0} right so far</div>`;
      } else {
        html += `<div class="card"><p>Watch the big screen. Your group plays on its own turn.</p></div>`;
      }
    } else if (P === "gresult" && S.gres){
      const r = S.gres, w = r.winner;
      if (r.g === g.g){
        const pos = r.ranking.findIndex(x => x.name === me), mineR = r.ranking[pos];
        html += `<div class="card">${w === me ? `<h2>You won your group!</h2><p>See you in the final.</p>` : `<h2>${w ? esc(shown(w)) + " goes to the final" : "Group finished"}</h2>`}
          ${mineR ? `<div class="big">${mineR.score}/${GROUP_LEVELS.length}</div><p>Your place: ${pos + 1} of ${r.ranking.length}</p>` : `<p>You didn’t answer in this round.</p>`}</div>
          <ul class="mini">${r.ranking.map((x, i) => `<li class="${x.name === me ? "mine" : ""}">${i + 1}. ${av(x.name)}<span>${esc(shown(x.name))}</span><b>${x.score}</b></li>`).join("")}</ul>`;
      } else html += `<div class="card"><h2>Group ${r.g + 1} is done</h2><p>${w ? esc(shown(w)) + " goes to the final." : ""}</p></div>`;
    } else if (["fq", "flock", "freveal"].includes(P) && S.fin){
      const f = S.fin, mineTurn = f.name === me, my = mine[f.qid];
      html += `<div class="pq"><span>${mineTurn ? `Your question ${f.rung + 1} · ${fmt(LADDER[f.rung])} pts` : `${esc(firstName(f.name))} · question ${f.rung + 1}`}</span>${P === "fq" ? `<span class="tm" data-tm></span>` : ""}</div><p class="ptxt">${esc(f.text)}</p>`;
      if (mineTurn){
        const pick = f.pick !== null ? f.pick : my;
        const st = d => P === "freveal" ? (d === f.correct ? " right" : d === f.pick ? " wrong" : " dim") : (d === pick ? " sel" : pick !== undefined && pick !== null ? " dim" : "");
        st.locked = (pick !== undefined && pick !== null) || P !== "fq";
        html += buttons(f.opts, st);
        html += `<div class="note${P === "freveal" ? (f.ok ? " good" : " bad") : ""}">${P === "freveal" ? (f.ok ? `Correct! ${fmt(f.points)} points` : `The climb ends on ${fmt(f.points)} points`) : f.paused && (pick === undefined || pick === null) ? "Ask the audience: listen to the room, then tap" : pick !== undefined && pick !== null ? `Locked in · ${LETTERS[pick]}` : "Tap your answer"}</div>`;
      } else {
        html += `<div class="card"><p>${f.paused ? `${esc(firstName(f.name))} is asking the audience. Give your advice out loud!` : "Watch the big screen."}</p></div>`;
      }
    } else if (P === "fintro" && S.forder){
      const next = S.forder[S.fidx];
      html += `<div class="card"><div class="eyebrow">The final</div><h2>${next === me ? "You’re up next!" : esc(shown(next)) + " is up next"}</h2><p>${next === me ? "Get ready. The questions will appear here." : "Watch the big screen."}</p></div>`;
      if (S.stand) html += standList();
    } else if (P === "champion" && S.stand){
      const w = S.stand[0];
      html += `<div class="card"><div class="eyebrow">Champion</div><h2>${w.name === me ? "You won the Big RAS Quiz!" : esc(shown(w.name))}</h2><p>${fmt(w.points)} points</p></div>${standList()}`;
    } else {
      const r = S.results[g.g];
      html += `<div class="card">${r ? `<h2>Your group has played</h2><p>${r.winner ? esc(shown(r.winner)) + " goes to the final." : ""}</p>` : `<h2>You’re in</h2><p>Your group plays when the host starts it. Keep this page open; questions appear here.</p>`}</div>`;
    }
    html += `<div class="status" id="st"></div>`;
    app.innerHTML = `<div class="phone">${html}</div>`;
    tickTimer();
  }
  function standList(){ return `<ul class="mini">${S.stand.map((s, i) => `<li class="${s.name === me ? "mine" : ""}">${i + 1}. ${av(s.name)}<span>${esc(shown(s.name))}</span><b>${fmt(s.points)}</b></li>`).join("")}</ul>`; }
  function pickName(){
    if (!S.groups.length){ app.innerHTML = `<div class="phone"><div><div class="eyebrow">RAS Team Retreat</div><h1>The Big RAS Quiz</h1></div><div class="card"><h2>Almost ready</h2><p>The host hasn’t loaded the groups yet. Keep this page open.</p></div></div>`; lastKey = ""; return; }
    if (lastKey === "pick:" + S.groups.length) return;
    lastKey = "pick:" + S.groups.length;
    app.innerHTML = `<div class="phone"><div><div class="eyebrow">The Big RAS Quiz</div><h1>Who are you?</h1></div>
      <input class="find" id="find" placeholder="Search your name" autocomplete="off" value="${esc(filter)}" aria-label="Search your name">
      <div class="who-list" id="wl"></div></div>`;
    const draw = () => {
      const f = filter.trim().toLowerCase();
      $("#wl").innerHTML = S.groups.map(g => {
        const ms = g.members.filter(m => !f || shown(m).toLowerCase().includes(f));
        return ms.length ? `<div><h3>Group ${g.g + 1} · ${esc(g.name)}</h3><div class="names">${ms.map(m => `<button class="nbtn" data-act="pick" data-name="${esc(m)}">${av(m)}<span>${esc(shown(m))}</span></button>`).join("")}</div></div>` : "";
      }).join("");
    };
    draw();
    $("#find").addEventListener("input", e => { filter = e.target.value; draw(); });
  }
  function tickTimer(){
    const el = $("[data-tm]"), st = $("#st");
    if (el && S){
      const base = S.cur && S.phase === "q" ? S.cur.remain : S.fin ? S.fin.remain : 0;
      const paused = S.fin && S.fin.paused;
      const remain = paused ? base : Math.max(0, base - (Date.now() - recvAt));
      el.textContent = paused ? "paused" : Math.ceil(remain / 1000) + "s";
      el.classList.toggle("low", !paused && remain <= 5000);
    }
    if (st){ const stale = Date.now() - gotAt > 7000; st.textContent = stale ? "Lost contact with the big screen. Reconnecting…" : ""; st.classList.toggle("warn", stale); }
  }
  setInterval(tickTimer, 250);
  app.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
    if (el.dataset.act === "pick") choose(el.dataset.name);
    if (el.dataset.act === "switch"){ me = ""; store.del("rq-me"); net.track({id, name: "", at: Date.now()}); lastKey = ""; render(); }
    if (el.dataset.act === "ans" && S){
      const c = +el.dataset.c;
      if (S.phase === "q" && S.cur) answer(S.cur.qid, c);
      else if (S.phase === "fq" && S.fin && S.fin.name === me) answer(S.fin.qid, c);
    }
  });
  render();
}
</script>
</body>
</html>
